# אתר icmega (center.icmega.co.il) – הזמנות -> דוחות -> דו"ח הזמנות
# משמש לחבר משרתי הקבע, קרנות השוטרים ואי.סי. מגה.
# אפשר להעלות: את קובץ הזיפ שיורד מהאתר (נפתח לבד עם הסיסמה), את האקסל שבתוכו,
# או טבלה שהועתקה מהעמוד.
name: "icmega – חבר / שוטרים / מגה"
# משמש רק כדי לשבץ שורות איזי שלא נמצאו בגיליון הזה
easy_suppliers: ["חבר משרתי הקבע", "קרנות השוטרים", "אי.סי. מגה"]
detect: ["קוד עסקה", "מחיר לבודד"]
password_setting: chaver_excel_password
columns:
  voucher_id: "קוד עסקה"          # בעמוד: "קוד עסקה (שובר)"
  quantity: "כמות"
  final_price: "סה\"כ"             # "סה\"כ בהזמנה"
  unit_price: "מחיר לבודד"
  date: "תאריך מימוש"
  customer: "מספר שורה"            # בעמוד: "מספר שורה בהזמנה (לקוח)"
  # אין בדוח הזה שם חבילה ("סוג שובר" = "חמי יואב תיירות בעמ - אתר"), לכן נבדקים רק כמות ומחיר
has_price: true
# באיזי: מספר השובר בלי הספרה הראשונה = קוד עסקה באתר
easy_key: coupon_drop_first_digit
id_fallback: false
