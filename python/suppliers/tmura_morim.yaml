# תמורה – הסתדרות המורים
name: "תמורה – הסתדרות המורים"
# איך מזהים את חברת השוברים בדוח איזי (מספיק שהשם מכיל את אחד מהביטויים)
easy_suppliers: ["הסתדרות המורים"]
# עמודות שחייבות להופיע בשורת הכותרות – כך המערכת מזהה שהקובץ הוא של הספק הזה
detect: ["מס' הזמנה", 'ת"ז', "כמות מימושים", "עלות"]
columns:
  voucher_id: "מס' הזמנה"
  id_number: 'ת"ז'
  package_name: "תאור ווריאנט"
  quantity: "כמות מימושים"
  final_price: "עלות"
  date: "תאריך מימוש"
  customer: "שם"
has_price: true
# המספר באיזי = מספר השובר כמו שהוא
easy_key: coupon
# אם אין התאמה לפי מספר שובר – לנסות לפי ת"ז
id_fallback: true
