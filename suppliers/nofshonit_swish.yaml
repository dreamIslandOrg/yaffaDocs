# נופשונית (Swish) – dtsreports.dts.co.il
# הדוח הוא טבלה בחלונית "פרטי הזמנות לתאריך ..." – המערכת שומרת אותה כ-CSV עם אותן כותרות.
# אפשר גם להעתיק את הטבלה ידנית לאקסל ולהעלות.
name: "נופשונית – Swish"
# משמש רק כדי לשבץ שורות איזי שלא נמצאו (ההצלבה עצמה לפי מספר שובר בלבד)
easy_suppliers: ["נופשונית"]
detect: ["מזהה לקוח", "כמות שמומשה", "וריאנט", "אסמכתא"]
columns:
  voucher_id: "מזהה לקוח"      # ת"ז של הלקוח = מספר השובר באיזי
  package_name: "וריאנט"
  quantity: "כמות שמומשה"
  reference: "אסמכתא"
has_price: false               # בנופשונית אין סכומים
easy_key: coupon
# שורה לכל אדם אצל הספק, ובאיזי שורה עם כמות – מאחדים לפי ת"ז וסוכמים
aggregate_by_key: true
id_fallback: true
